{% load static %}

            <div class="question-card"
                data-vote-url="{% url 'vote_question' question.id %}"
                data-csrf-token="{{ csrf_token }}">
                <div class="question-left">
                                        
                    {% if question.author.profile.avatar %}
                        <img
                            class="question-avatar"
                            src="{{ question.author.profile.avatar.url }}"
                            alt="Аватар автора вопроса"
                        >
                    {% else %}
                        <img
                            class="question-avatar"
                            src="{% static 'img/avatar.png' %}"
                            alt="Аватар автора вопроса"
                        >
                    {% endif %}

                    <div class="rating {% if question.user_vote == 1 %}rating-liked{% elif question.user_vote == -1 %}rating-disliked{% endif %}">
                        <span class="rating-value">{{ question.rating }}</span>
                        <div class="arrows"
                            {% if not request.user.is_authenticated %}
                                title="Войдите в аккаунт, чтобы голосовать"
                            {% endif %}>

                            <button type="button"
                                    class="like-arrow"
                                    {% if not request.user.is_authenticated %}disabled{% endif %}>
                                ↑
                            </button>

                            <button type="button"
                                    class="dislike-arrow"
                                    {% if not request.user.is_authenticated %}disabled{% endif %}>
                                ↓
                            </button>
                        </div>
                    </div>
                </div>
                <div class="question-body">
                    <h4>
                        <a href="{% url 'question' question.id %}">{{ question.title }}</a>
                    </h4>
                    <p>{{ question.text }}</p>
                    <div class="question-meta">
                        <a href="{% url 'question' question.id %}">
                            answer ({{ question.answers_count }})
                        </a>
                        <p class="question-tags">
                            Tags:
                            {% for tag in question.tags.all %}
                                <a href="{% url 'tag' tag.slug %}">{{ tag.name }}</a>
                            {% endfor %}
                        </p> 
                        <span class="question-time">{{ question.created_at|timesince }} назад</span>
                    </div>
                </div>
            </div>
