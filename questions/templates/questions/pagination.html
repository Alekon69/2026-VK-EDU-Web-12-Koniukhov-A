
<div class="paginator">
    <ul class="pagination">

        {% if page_obj.has_previous %}
            <li class="page-item">
                <a class="page-link"
                   href="?page={{ page_obj.previous_page_number }}">
                    Previous
                </a>
            </li>
        {% endif %}

        {% for number in page_obj.elided_range %}
            {% if number == "…" %}
                <li class="page-item">
                    <span class="page-link">…</span>
                </li>
            {% else %}
                <li class="page-item {% if number == page_obj.number %}active{% endif %}">
                    <a class="page-link" href="?page={{ number }}">
                        {{ number }}
                    </a>
                </li>
            {% endif %}
        {% endfor %}

        {% if page_obj.has_next %}
            <li class="page-item">
                <a class="page-link"
                   href="?page={{ page_obj.next_page_number }}">
                    Next
                </a>
            </li>
        {% endif %}

    </ul>
</div>
