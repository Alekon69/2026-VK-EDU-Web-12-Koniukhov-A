{% extends 'base.html' %}
{% load static %}

{% block content %}

        <div class="profile-page">
            <h2>Settings: user_name</h2>
            <span class="form-error">
                Profile was not saved. Check the fields below.
            </span>
            <div class="rows">
                <span class="form-label">Login</span>
                <span class="login-border">user_name</span>
            </div>
            <div class="rows">
                <span class="form-label">Email</span>
                <span class="login-border">user_email</span>
            </div>
            <span class="field-error">
                Invalid email
            </span>
            <div class="rows">
                <span class="form-label">NickName</span>
                <span class="login-border">user_nick</span>
            </div>
            <div class="rows">
                <span class="form-label">Upload avatar</span>
                <img class="profile-avatar" src="{% static 'img/avatar.png' %}" alt="Аватар">
            </div>
            <span class="form-hint">
                JPG or PNG, maximum 5 MB
            </span> 
            <div class="choose-avatar" style="width: 200px; margin-left: 150px;">
                <span class="avatar-path">c:\avatar.jpg</span>
                <button class="choose-button">choose</button>
            </div>
            <button class="save-button" style="margin-top: 25px;">Save</button>
        </div>

{% endblock %}
